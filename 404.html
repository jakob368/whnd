<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — WHND Holding AB</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4f1ec;--ink:#191817;--blue:#002fa7;--muted:#6f6a62}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
  .hero{position:relative;height:100svh;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .wordmark-group{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3svh,32px);
    color:var(--blue);mix-blend-mode:multiply;
    user-select:none;pointer-events:none;z-index:2;
  }
  .wordmark{font-weight:900;font-size:clamp(130px,30vw,560px);line-height:1;letter-spacing:-.045em}
  .wordmark span{
    display:inline-block;opacity:0;filter:blur(26px);
    transform:translateY(.07em) scale(1.08);
    animation:soak 2.6s cubic-bezier(.2,.6,.15,1) forwards;
  }
  .wordmark span:nth-child(1){animation-delay:.4s}
  .wordmark span:nth-child(2){animation-delay:.65s}
  .wordmark span:nth-child(3){animation-delay:.9s}
  @keyframes soak{55%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
  .sub{
    font-size:clamp(13px,1.4vw,18px);font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;text-align:center;
    opacity:0;animation:fadein 1.6s ease 2s forwards;
  }
  @keyframes fadein{to{opacity:1}}
  .home{
    position:absolute;left:50%;bottom:clamp(32px,8svh,72px);
    transform:translateX(-50%);
    z-index:3;
    font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--blue);text-decoration:none;
    border:1.5px solid var(--blue);border-radius:999px;
    padding:14px 28px;
    opacity:0;animation:fadein 1.2s ease 2.6s forwards;
    transition:background .2s,color .2s;
  }
  .home:hover{background:var(--blue);color:#fff}
  @media (prefers-reduced-motion:reduce){
    .wordmark span,.sub,.home{animation:none;opacity:1;filter:none;transform:none}
    .home{transform:translateX(-50%)}
  }
</style>
</head>
<body>
<div class="hero">
  <canvas id="inkc"></canvas>
  <div class="wordmark-group">
    <h1 class="wordmark" aria-label="404"><span>4</span><span>0</span><span>4</span></h1>
    <p class="sub">Nothing here &mdash; the ink dried</p>
  </div>
  <a class="home" href="/">Back to WHND</a>
</div>
<script>
(function(){
  const LOCK={speed:1.0,amt:0.07,pull:1.3};
  const canvas=document.getElementById('inkc');
  const gl=canvas.getContext('webgl',{antialias:false,alpha:false});
  if(!gl){canvas.style.background='linear-gradient(160deg,#f4f1ec 40%,#c7d0ea)';return;}
  const vsrc='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const fsrc=`
    precision highp float;
    uniform vec2 u_res;uniform float u_t;uniform vec2 u_mouse;
    uniform float u_mi;uniform float u_amt;uniform float u_pull;
    float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(13.7,7.1);a*=.5;}return v;}
    void main(){
      float aspect=u_res.x/u_res.y;
      vec2 uv=gl_FragCoord.xy/u_res;
      vec2 p=(uv-.5)*vec2(aspect,1.)*1.9;
      vec2 m=(u_mouse-.5)*vec2(aspect,1.)*1.9;
      float t=u_t*.045;
      float md=length(p-m);
      float pull=exp(-md*md*2.6)*u_mi*u_pull;
      vec2 q=vec2(fbm(p+vec2(0.,t)),fbm(p+vec2(5.2,-t*1.25)));
      vec2 drag=(m-p)*pull*.9;
      vec2 r=vec2(fbm(p+2.6*q+drag+vec2(1.7,9.2)+t*.55),fbm(p+2.6*q-drag+vec2(8.3,2.8)-t*.35));
      float f=fbm(p+3.2*r+drag*1.4);
      f+=pull*.22;
      vec3 paper=vec3(.957,.945,.925);
      vec3 blue=vec3(0.,.184,.655);
      vec3 deep=vec3(0.,.075,.33);
      float ink1=smoothstep(.38-u_amt,.80-u_amt,f);
      float ink2=smoothstep(.68-u_amt,.98-u_amt,f);
      vec3 col=mix(paper,blue,ink1);
      col=mix(col,deep,ink2*.75);
      float g=hash(gl_FragCoord.xy+fract(u_t)*vec2(311.7,183.3));
      col+=(g-.5)*.05;
      float v=smoothstep(1.45,.45,length((uv-.5)*vec2(aspect,1.)));
      col=mix(col*.93,col,v);
      gl_FragColor=vec4(col,1.);
    }`;
  function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,vsrc));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fsrc));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U={};['u_res','u_t','u_mouse','u_mi','u_amt','u_pull'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,1.5);
    canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  resize();addEventListener('resize',resize);
  let tx=.5,ty=.5,mx=.5,my=.5,mi=0,ti=0;
  addEventListener('pointermove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;ti=1;});
  addEventListener('pointerleave',()=>{ti=0;});
  const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let simT=0,last=performance.now();
  function frame(now){
    simT+=(now-last)/1000*LOCK.speed;last=now;
    mx+=(tx-mx)*.035;my+=(ty-my)*.035;mi+=(ti-mi)*.04;
    gl.uniform2f(U.u_res,canvas.width,canvas.height);
    gl.uniform1f(U.u_t,reduceMotion?12.0:simT);
    gl.uniform2f(U.u_mouse,mx,my);
    gl.uniform1f(U.u_mi,mi);
    gl.uniform1f(U.u_amt,LOCK.amt);
    gl.uniform1f(U.u_pull,LOCK.pull);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!reduceMotion)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
